name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm run install:all

      - name: Build frontend
        run: npm run build

      - name: Build and package Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'K.I.P. Hub ${{ github.ref_name }}'
          releaseBody: |
            ### K.I.P. Hub ${{ github.ref_name }}
            
            This release is licensed under the **GNU General Public License v3.0 (GPL-3.0)**.
            
            #### Highlights:
            - Full TypeScript 5+ & Tauri v2.12 async architecture.
            - Low-latency audio DSP engine & WebRTC voice channels.
            - Malware heuristic shield & automatic crash dump analysis.
            - Multiplatform binaries (Windows, Linux, macOS) with cryptographic update signing.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}